name: CI Dev Deployment Test

on:
  push:
  pull_request:

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Build Artifact
        run: zip -r build.zip src requirements.txt
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: build.zip
          retention-days: 1

  test:
    name: Lint & Unit Tests (Python Matrix)
    needs: build
    runs-on: ubuntu-latest

    # 🧩 新增：matrix 支援多版本 Python 測試
    strategy:
      matrix:
        python-version: [3.9, 3.11, 3.13]
      fail-fast: false   # 若一個版本失敗，其他版本仍會繼續測試

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      # 🧠 新增 Lint 步驟：靜態程式檢查
      - name: Run Lint Check
        run: |
          echo "Running flake8 linting for Python ${{ matrix.python-version }}..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # ✅ 單元測試
      - name: Run Unit Tests
        run: |
          echo "Running Unit Tests for Python ${{ matrix.python-version }}..."
          pytest -v tests

      # 🕒 額外輸出：方便分析不同版本執行時間
      - name: Show run time
        run: echo "CI completed for Python ${{ matrix.python-version }} at $(date)"

  deploy-dev:
    name: Deploy to Dev
    needs: test
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact

      - name: Simulate Dev Deployment
        run: |
          echo "Build artifact downloaded. Simulating deployment to dev environment."
          echo "Deployment successful."